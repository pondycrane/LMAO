# E2E: Sprout 300-byte resource → LMAO server (host, deterministic).
#
# Feature parity with `resource-500b-e2e` (the Cardputer's RF-proven cross-check)
# but for the Sprout's send path: both firmwares share `lma-link-resource`
# (the RNS Link initiator + Resource push), which wraps `leaf_resource::ResourceTx`
# with its own part SDU (`lma_link_resource::RESOURCE_SDU = 160`, so each
# encrypted part carrier stays ≤254 B → a single accepted RAK frame).
#
# The payload here is the Sprout's 300-B RF target (heap-safe vs the Cardputer's
# 500 B — the Atom Lite has less heap). The SAME leaf `ResourceTx → ResourceRx`
# state machines the firmware drives are re-run on the host; the reassembled
# bytes must hash to the pinned value. Deterministic, hardware-free cross-check
# of the Sprout's real RF path + pins the wire format to the deployed receiver.

[package]
name = "lmao-sprout-resource-300b-e2e"
version.workspace = true
edition.workspace = true

[dependencies]
leaf-resource = { path = "../../crates/leaf-resource" }
lma-link-resource = { path = "../../crates/lma-link-resource" }
rns-core = "0.1.17"
rns-crypto = "0.1.10"
