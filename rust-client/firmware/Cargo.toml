# T1 firmware — ESP32-S3 (Cardputer) no_std boot/blink (design ticket T1).
#
# This is its OWN Cargo workspace (independent of the host workspace at
# rust-client/../): the firmware cross-compiles for xtensa-esp32s3-none-elf
# with the esp nightly toolchain (see rust-toolchain.toml + .cargo/config.toml),
# while the host interop harness pins `stable`. Cargo resolves a package's
# toolchain by the nearest rust-toolchain.toml, so a separate workspace keeps
# them isolated.
[workspace]
resolver = "2"

[package]
name = "lmao-firmware-t1"
version = "0.1.0"
edition = "2021"
description = "ESP32-S3 no_std boot test for the LMAO Rust client (T1)"

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32s3"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "jtag-serial"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }

sx126x = { path = "../crates/sx126x" }
radio-interface = { path = "../crates/radio-interface" }
leaf-rns = { path = "../crates/leaf-rns" }
leaf-resource = { path = "../crates/leaf-resource" }
# The chart renderer (no_std): parses the server's DATA line + draws the
# Sprout chart over a fill/pixel display trait (see src/display.rs).
lma-chart = { path = "../crates/lma-chart" }
# Built-in Cardputer-ADV ST7789 panel, driven by the open-source mipidsi driver
# (same crate + config as BotEkrem/echoputer, a proven no_std Rust Cardputer-ADV
# project): mipidsi owns the ST7789 init/reset/window/rotation.
mipidsi = { version = "0.10", default-features = false }
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"
embedded-hal = "1.0"
# rns-core pulls rns-crypto with default features (std). It has an optional
# no_std `std` feature — force it off so the RNS packet code cross-compiles for
# the xtensa firmware target (we need RawPacket pack/unpack, not std RNG).
rns-crypto = { version = "0.1.10", default-features = false }
rns-core = { version = "0.1.17", default-features = false }
lxmf-core = { version = "0.1.5", default-features = false }
linked_list_allocator = "0.10"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[patch.crates-io]
rns-crypto = { path = "../vendor/rns-crypto" }
