# Sprout sender firmware — the Atom Lite (ESP-32, not S3) no_std edge sender
# for the LMAO Rust stack (design: "rust on sprout, so it starts sending data
# to the rust LMAO server").
#
# This is its OWN Cargo workspace (independent of the host workspace at
# rust-client/..): it cross-compiles for xtensa-esp32-none-elf with the esp
# nightly toolchain, isolated from the s3 firmware + host crates.
[workspace]
resolver = "2"

[package]
name = "lmao-firmware-sprout"
version = "0.1.0"
edition = "2021"
description = "ESP32 no_std Sprout sender (Atom Lite + RAK3172 DTU P2P LoRa) for the Rust LMAO server"

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32", "unstable"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32", "uart"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32"] }

# RNS/LXMF packet + crypto (no_std; the `std` features are off like the s3
# firmware so RawPacket pack/unpack + X25519 encryption cross-compile).
rns-crypto = { version = "0.1.10", default-features = false }
rns-core = { version = "0.1.17", default-features = false }
lxmf-core = { version = "0.1.5", default-features = false }
# Sprout DTU radio protocol + no_std SensorReport envelope (host-tested crate;
# pulls radio-interface framing).
lma-dtu = { path = "../crates/lma-dtu" }
# esp-hal implements embedded-hal 1.0 I2c (used for the ENV III SHT30 read).
embedded-hal = "1.0"
# ADC one-shot read is `nb`-based in esp-hal.
nb = "1"
linked_list_allocator = "0.10"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[patch.crates-io]
rns-crypto = { path = "../vendor/rns-crypto" }
