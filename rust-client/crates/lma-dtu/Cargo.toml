[package]
name = "lma-dtu"
version.workspace = true
edition.workspace = true
description = "Sprout RAK3172 DTU (LoRa P2P) UART-AT radio protocol + no_std SensorReport envelope (the Rust Sprout send leg)"

[dependencies]
# RNode LoRa RF frame demux/split reassembly (1-byte header + split framing) —
# reused verbatim by the Sprout's on-air frames on the same mesh.
radio-interface = { path = "../radio-interface" }
