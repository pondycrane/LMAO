syntax = "proto3";

package lma;

// Top-level envelope — oneof dispatches to the correct message type.
// Use Title="p:Envelope" in LXMF to signal protobuf-encoded Content.

message LMAOEnvelope {
  oneof payload {
    SensorReport    sensor  = 10;
    CommandRequest  command = 11;
    CommandAck      ack     = 12;
    TextMessage     text    = 20;
    AudioMessage    audio   = 21;
    ImageMessage    image   = 22;
    ChartBundle     chart   = 23;   // server -> Cardputer chart downlink
    CallSignal      call    = 30;
    LmafManifest    manifest    = 40;
    LmafChunk       chunk       = 41;
    LmafAck         ack_lmaf    = 42;
    LmafCapability  capability  = 43;
  }
}

// --- Grow-node chart downlink (server -> Cardputer) ---
//
// One node's soil-moisture / air-temperature / air-humidity history, sent on
// the reply so the Cardputer can render the chart.  Deliberately single-packet
// (~295 B LXMF content cap): values are compact uint32 percents (temp in
// tenths of C), and the time axis is reconstructed from start_ms + period_ms
// + array index instead of a uint64 timestamp per sample.
message ChartBundle {
  uint32 format    = 1;   // chart payload format version (1)
  string node_id   = 2;   // which grow node the series belongs to
  uint32 dry       = 3;   // irrigation dry threshold, in %
  uint32 wet       = 4;   // irrigation wet threshold, in %
  uint64 start_ms  = 5;   // epoch ms of the first sample (nominal)
  uint32 period_ms = 6;   // nominal sample spacing (5 min) -> gaps detectable
  repeated uint32 soil = 7;  // soil moisture %, newest last (up to 30)
  repeated uint32 temp = 8;  // air temperature in tenths of C, newest last
  repeated uint32 hum  = 9;  // air humidity %, newest last
  uint64 watered       = 10; // bit i = pump ran during soil[i] (oldest first)
}

// --- IoT Sensor ---

message SensorReport {
  string node_id = 1;
  uint32 seq     = 2;
  float  battery = 3;
  repeated SensorReading readings = 4;
}

// Canonical sensor_id registry (shared across Cardputer, Sprout, and any LMAO
// node).  One SensorReport.readings[] may bundle several ids (e.g. the Sprout
// sends 2+3+4 in a single report).
//   sensor_id 1  = die temperature          unit "C"    Espressif internal temp
//   sensor_id 2  = ambient humidity         unit "%"    SHT30 / DHT20
//   sensor_id 3  = ambient temperature      unit "C"    SHT30 (ENV III)
//   sensor_id 4  = soil moisture            unit "%"    2-point calibrated
//   sensor_id 5  = barometric pressure      unit "hPa"  QMP6988
//   sensor_id 6  = pump duration            unit "s"
//   sensor_id 7  = pump active              unit ""     bool 0/1
//   sensor_id 8  = battery voltage          unit "V"
//   sensor_id 9  = RSSI                     unit "dBm"
//   sensor_id 10 = profile dry threshold    unit "%"    Sprout plant profile
//   sensor_id 11 = profile wet threshold    unit "%"    Sprout plant profile
// Add new measurement types with sensor_id >= 10 and document them here.
// Canonical unit for a sensor reading (replaces the old free-text string).
// Keep in sync with the sensor_id registry above — a reading's unit is implied
// by its sensor_id; this enum makes it explicit + typed on the wire.
enum Unit {
  UNIT_UNSPECIFIED  = 0;  // unknown / not set
  UNIT_PERCENT      = 1;  // soil moisture, humidity, profile dry/wet
  UNIT_CELSIUS      = 2;  // air temp, die temp
  UNIT_HECTOPASCAL  = 3;  // barometric pressure (sensor 5)
  UNIT_SECONDS      = 4;  // pump duration (sensor 6)
  UNIT_VOLTS        = 5;  // battery voltage (sensor 8)
  UNIT_DBM          = 6;  // RSSI (sensor 9)
  UNIT_BOOL         = 7;  // pump active flag (sensor 7), 0/1
}

message SensorReading {
  uint32 sensor_id   = 1;
  float  value       = 2;
  Unit   unit        = 3;  // was `string unit`; now the typed enum (field 3,
                           // wire type string->varint — breaking co-redeploy)
  uint64 timestamp_ms = 4;
}

// --- Commands ---

message CommandRequest {
  string cmd_id     = 1;
  string target     = 2;
  string action     = 3;
  map<string, string> params = 4;
  uint64 issued_ms  = 5;
  uint64 expires_ms = 6;
}

message CommandAck {
  string cmd_id     = 1;
  string node_id    = 2;
  bool   success    = 3;
  string message    = 4;
}

// --- Human Communication ---

message TextMessage {
  string node_id   = 1;
  string content   = 2;
  uint64 timestamp = 3;
}

message AudioMessage {
  string node_id       = 1;
  bytes  audio_data    = 2;
  string codec         = 3;  // e.g. "opus", "codec2"
  uint32 duration_ms   = 4;
  uint64 timestamp     = 5;
}

message ImageMessage {
  string node_id       = 1;
  bytes  image_data    = 2;
  string format        = 3;  // e.g. "webp", "jpeg"
  uint32 width         = 4;
  uint32 height        = 5;
  uint64 timestamp     = 6;
}

// --- Call Signaling ---

message CallSignal {
  enum Signal {
    OFFER     = 0;
    ANSWER    = 1;
    ICE       = 2;
    HANGUP    = 3;
    KEEPALIVE = 4;
  }
  Signal signal        = 1;
  string sdp_or_ice    = 2;
  string media_type    = 3;
}
// ---------------------------------------------------------------------------
// LMAF / successor transfer framing (T8).  Chunked, integrity-checked transfer
// of a large attachment (chart, audio, image, ...) over the stable RNS Resource
// substrate.  Wire contract pinned from the native C++ client's
// firmware_common lma_attachment encoder (field numbers must not drift).
// ---------------------------------------------------------------------------

// Transfer kind registry.
enum LmafKind {
  LMAF_UNSPECIFIED = 0;
  LMAF_VOICE       = 1;
  LMAF_AUDIO       = 2;
  LMAF_IMAGE       = 3;
  LMAF_VIDEO       = 4;
  LMAF_FILE        = 5;
  LMAF_CHART       = 6;
  LMAF_SIGNAL      = 7;
}

// AttachmentAck.Status contract.
enum LmafAckStatus {
  LMAF_RECEIVING = 0;
  LMAF_COMPLETE  = 1;
  LMAF_NEED      = 2;
  LMAF_REJECTED  = 3;
  LMAF_ABORTED   = 4;
}

// Transfer manifest: declares the whole attachment before its chunks.
message LmafManifest {
  bytes  id          = 1;  // sha256(payload)[:16] — session key
  bytes  payload_sha256 = 2;  // full 32 B digest, verified after assembly
  LmafKind kind         = 3;
  string codec          = 4;  // "lmao:chart-line-v1", "codec2:700C", ...
  uint32 chunk_size     = 5;
  uint32 chunk_count    = 6;
  uint64 total_bytes    = 7;
  uint32 sample_rate    = 8;
  uint32 channels       = 9;
  uint32 duration_ms    = 10;
  uint32 width          = 11;
  uint32 height         = 12;
  string node_id        = 13;
  uint64 created_ms     = 14;
}

// One chunk of a transfer.
message LmafChunk {
  bytes  id         = 1;  // matching LmafManifest.id
  uint32 index      = 2;
  bytes  data       = 3;
  fixed32 crc       = 4;  // CRC-32 (zlib/EDB88320) of data
}

// Receiver -> sender acknowledgement / gap report.
message LmafAck {
  bytes          id        = 1;
  LmafAckStatus  status    = 2;
  uint32         have_count = 3;
  repeated uint32 missing  = 4 [packed = false];  // chunk indexes still needed (C++ emits non-packed)
  string         reason    = 5;
}

// What a node accepts, for the sender to size its chunks.
message LmafCapability {
  uint32   lmaf_version       = 1;
  repeated LmafKind kinds     = 2 [packed = false];  // C++ lma_attachment emits non-packed
  repeated string  codecs     = 3;
  uint32   max_chunk_size     = 4;
  uint64   max_attachment_bytes = 5;
  uint32   rx_window          = 6;
  uint32   airtime_budget_bps = 7;
}
