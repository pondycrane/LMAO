# IDF Component Manager manifest for robodog_phase0. The claw_* components
# live outside the edge_agent app tree (repo-root components/claw_modules/).
# This manifest sits at application/edge_agent/components/robodog_phase0, i.e.
# FOUR levels below the repo root — the same ../../../../ depth http_server
# uses. (A shallower ../../../ resolves to <app-parent>/components/... , which
# the component manager evaluates against a base that does not exist.)
dependencies:
  claw_manager:
    path: ../../../../components/claw_modules/claw_manager
  claw_core:
    path: ../../../../components/claw_modules/claw_core
  # Phase 2 voice loop: shared audio hub (mic APP subscriber + speaker APP
  # track) and the WiFi-ready gate.
  audio_hub:
    path: ../../../../components/common/audio_hub
  wifi_manager:
    path: ../../../../components/common/wifi_manager
  # Deterministic text-only UI (Phase 1): esp-claw's own display_service is
  # gated behind a config symbol the board manager drops for this custom panel,
  # so the LMAO UI drives the LVGL adapter directly.
  espressif/esp_lvgl_adapter: "*"
  lvgl/lvgl:
    version: ^9.5.0,<9.6.0
    public: true
  # Phase 3 omni realtime: the OpenAI-Realtime session is a WebSocket. The
  # component is already in the dependency graph (cap_im_platform pulls it),
  # but a component's REQUIRES only resolves deps it declares itself — so the
  # manifest must name it too or CMake fails with "unknown name".
  espressif/esp_websocket_client: "^1.4.0"
