# Pipeline Silence Monitor — K8s CronJob
#
# Checks whether the ingest pipeline has written a row recently, using the
# server-side `ingested_at` clock (the device clock is routinely hours off).
# Reuses the lmao-iot-ingest image and asks its query API — no extra deps.
#
# If nothing has been ingested within the threshold, the job logs
# PIPELINE SILENCE and exits 1 (failing the CronJob).  Operators can see it
# via `kubectl logs job/pipeline-monitor-<ts>`; tools/cluster_watchdog escalates
# on it and alerts through Matrix.
#
# Prerequisites:
#   - iot-ingest-consumer running with its query API (k8s/iot-ingest.yaml)
#   - lmao-iot-ingest Docker image pushed to local registry:
#       ./docker/registry/manage.sh push-ingest
#   - K3s nodes configured to pull from the local registry
#
# Usage:
#   kubectl apply -f k8s/pipeline-monitor.yaml
#
# Configuration env vars (via ConfigMap pipeline-monitor-config):
#   QUERY_URL                Ingest query API base URL
#   SILENCE_THRESHOLD_HOURS  Max gap since the last ingested row (default: 3)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-monitor-config
  namespace: default
  labels:
    app: pipeline-monitor
data:
  QUERY_URL: "http://iot-query.default.svc.cluster.local:8080"
  SILENCE_THRESHOLD_HOURS: "3"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-monitor
  namespace: default
  labels:
    app: pipeline-monitor
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          containers:
            - name: monitor
              image: op4:5000/lmao-iot-ingest:latest
              imagePullPolicy: Always
              command: ["python", "k8s-app/pipeline_monitor.py"]
              envFrom:
                - configMapRef:
                    name: pipeline-monitor-config
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
          restartPolicy: Never
