name: robodog-hermes-dev
description: |
  Use when: You have a feature idea or description and want end-to-end development
  in the LMAO repo for the RoboDog **hermes voice device** — the same Waveshare
  ESP32-S3 RLCD-4.2 (ST7305) board running the XiaoZhi voice firmware
  (robodog_client/voice, self-built from pinned upstream + the RD_SHOT capture
  hook + the RD_LISTEN software button), the bridge (ASR -> Hermes brain ->
  Kokoro TTS) and the acoustic voice-loop E2E (issue #267 / robodog-voice-e2e).
  Input: Feature description in natural language, or path to a PRD file
  Output: PR ready for merge with comprehensive review + voice-loop E2E evidence
  (RD_LISTEN session open + ASR transcript match + Hermes reply + ring closure +
  RLCD subtitle readback).

  Hermes-dev workflow (voice-loop + pixel verification):
  1. Create implementation plan (hermes rules baked in — every voice/display
     change must be validated by the acoustic voice-loop E2E (DB) and/or the
     hermes screen capture, never by assertion)
  2. Setup branch and extract scope limits
  3. Verify plan research is still valid
  4. Implement all tasks with Bazel build-checking + firmware build via
     `bazel run //robodog_client:build_robodog_hermes` (XiaoZhi source is
     fetched, never vendored) + the voice-backend bazel targets
  5. robodog-hermes-validate gate (BUILD completeness + bazel build + ruff/mypy +
     unit tests, firmware compile via build_robodog_hermes)
  6. MANDATORY robodog-hermes-e2e gate: build + flash the real board with the
     hermes image (host esptool via //robodog_client:flash_robodog_hermes — the
     only sanctioned esptool path for 0x303A:0x1001), SCREEN-CAPTURE the exact
     ST7305 pixels (RD_SHOT over USB-JTAG) and read the render back with the
     vision model (Qwen2.5-VL via capture.py --describe)
  7. MANDATORY robodog-voice-e2e gate: autonomous acoustic voice-loop
     (bazel run //robodog_client:hermes_voice_e2e — RD_LISTEN -> session asr
     transcript match -> Hermes reply -> test-mic ring closure -> subtitle
     readback; E2E_STT injection fallback documented; loud skip when board or
     ALSA test card absent)
  8. robodog-production-health gate (.gate-head owner)
  9. Create PR with template + the hermes voice evidence (hermes-hardware-e2e.md
     + robodog-voice-loop-e2e.md verbatim), mark ready
  10. Comprehensive code review (5 parallel agents with scope limit awareness)
  11. Synthesize and fix review findings
  12. RE-RUNS the full gate chain after any fix commits (fast-pass only when
      HEAD is unchanged — the #87 regression guard). Re-running the hermes gates
      re-flashes the board and re-captures, so a voice/display regression cannot
      hide
  13. Final summary with decision matrix -> GitHub comment

  NOT for: Cardputer/LoRa work (lmao-feature-dev), GitHub-issue fixes
  (lmao-fix-issue), Smart Irrigation (smart-irrigation-dev), standalone reviews,
  or the RoboDog *calendar* firmware (robodog-client-dev — same board, mutually
  exclusive flashes; never run both workflows at once).

  Models: archon tiers (large/medium/small) resolved from ~/.archon/config.yaml (today all map to gx10 DeepSeek V4 Flash — edit config.yaml once to reroute when the local model is down) for
  the agent. The screen-capture/vision READBACK inside robodog-hermes-e2e and the
  ASR re-read inside robodog-voice-e2e are fixed pipelines, not the agent model.
  No Claude anywhere.

inputs:
  # Declared so the review-chain commands' $INPUTS.* references resolve
  # (archon >=0.12 strict-fails undeclared inputs). All optional; empty means
  # "standalone full review, first round".
  scope: { default: "", description: "Requested review scope (may be empty)" }
  prior_report: { default: "", description: "Path to previous round's report (empty = first round)" }
  work_order: { default: "", description: "Accepted work order (empty for standalone review)" }
  part: { default: "", description: "Part assignment (empty = whole contract)" }
  policy_defaults: { default: "", description: "Policy overrides (empty = defaults)" }

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 0: CREATE PLAN (hermes voice rules baked in)
  # ═══════════════════════════════════════════════════════════════════

  - id: create-plan
    command: robodog-hermes-create-plan
    context: fresh
    model: large
    effort: high

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: SETUP
  # ═══════════════════════════════════════════════════════════════════

  - id: plan-setup
    command: lmao-plan-setup
    depends_on: [create-plan]
    context: fresh
    model: large

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: CONFIRM PLAN
  # ═══════════════════════════════════════════════════════════════════

  - id: confirm-plan
    command: lmao-confirm-plan
    depends_on: [plan-setup]
    context: fresh
    model: large

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT (hermes voice rules + Bazel + hermes firmware build)
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-tasks
    command: robodog-hermes-implement-tasks
    depends_on: [confirm-plan]
    context: fresh
    model: large
    effort: max

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: HERMES GATE CHAIN — validate → hermes screen capture →
  # voice loop E2E → production health. Mandatory before PR creation.
  # ═══════════════════════════════════════════════════════════════════

  - id: validate
    command: robodog-hermes-validate
    depends_on: [implement-tasks]
    context: fresh
    model: large

  - id: hermes-hardware-e2e
    command: robodog-hermes-e2e
    depends_on: [validate]
    context: fresh
    model: large

  - id: voice-loop-e2e
    command: robodog-voice-e2e
    depends_on: [hermes-hardware-e2e]
    context: fresh
    model: large

  - id: production-health
    command: robodog-production-health
    depends_on: [voice-loop-e2e]
    context: fresh
    model: large

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINALIZE PR (robodog-hermes-e2e writes
  # $ARTIFACTS_DIR/hermes-hardware-e2e.md and robodog-voice-e2e writes
  # $ARTIFACTS_DIR/robodog-voice-loop-e2e.md — the hermes finalize gate
  # requires BOTH, distinct from the calendar workflow's hardware-e2e.md)
  # ═══════════════════════════════════════════════════════════════════

  - id: finalize-pr
    command: robodog-hermes-finalize-pr
    depends_on: [production-health]
    context: fresh
    model: large

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 6: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [finalize-pr]

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [verify-pr-base]
    context: fresh
    model: large

  - id: sync
    command: lmao-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh
    model: large

  - id: code-review
    command: archon-code-review-agent
    depends_on: [sync]
    context: fresh
    model: large

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [sync]
    context: fresh
    model: large

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [sync]
    context: fresh
    model: large

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [sync]
    context: fresh
    model: large

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [sync]
    context: fresh
    model: large

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh
    model: large

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 7: FIX REVIEW ISSUES (hermes-adapted)
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-fixes
    command: robodog-hermes-implement-review-fixes
    depends_on: [synthesize]
    context: fresh
    model: large
    effort: max

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 8: FINAL GATE CHAIN — re-run after review-fix commits.
  # Fast-pass ONLY when HEAD is unchanged since the first gate chain
  # (.gate-head marker, written by robodog-production-health); any new commit
  # forces the FULL chain including a re-flash + re-capture of the board.
  # The #87 regression guard.
  # ═══════════════════════════════════════════════════════════════════

  - id: final-validate
    command: robodog-hermes-validate
    depends_on: [implement-fixes]
    context: fresh
    model: large

  - id: final-hermes-hardware-e2e
    command: robodog-hermes-e2e
    depends_on: [final-validate]
    context: fresh
    model: large

  - id: final-voice-loop-e2e
    command: robodog-voice-e2e
    depends_on: [final-hermes-hardware-e2e]
    context: fresh
    model: large

  - id: final-production-health
    command: robodog-production-health
    depends_on: [final-voice-loop-e2e]
    context: fresh
    model: large

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 9: FINAL SUMMARY & FOLLOW-UP
  # ═══════════════════════════════════════════════════════════════════

  - id: workflow-summary
    command: archon-workflow-summary
    depends_on: [final-production-health]
    context: fresh
    model: large

  # ─── Push notification via ntfy (bash + curl) ─────────────────
  # To enable, create .archon/mcp/ntfy.json with {"NTFY_TOPIC": "..."}
  # in the project root. No-op when the file is absent.

  - id: ntfy-result
    bash: |
      if [ ! -f .archon/mcp/ntfy.json ]; then exit 0; fi
      NTFY_TOPIC="${NTFY_TOPIC:-$(grep -oP '"NTFY_TOPIC":\s*"\K[^"]+' .archon/mcp/ntfy.json 2>/dev/null)}"
      [ -z "$NTFY_TOPIC" ] && exit 0
      if [ -f "$ARTIFACTS_DIR/workflow-summary.md" ]; then
        TITLE="✅ RoboDog-Hermes-Dev Complete"
        TAGS="white_check_mark"
        BODY="Workflow completed successfully for: $ARGUMENTS"
      else
        TITLE="❌ RoboDog-Hermes-Dev Failed"
        TAGS="x"
        BODY="Workflow failed for: $ARGUMENTS"
      fi
      curl -sf -H "Title: $TITLE" -H "Priority: 4" -H "Tags: $TAGS" \
        -d "$BODY" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null 2>&1
    depends_on: [workflow-summary]
    trigger_rule: all_done
