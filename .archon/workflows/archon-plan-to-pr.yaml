name: archon-plan-to-pr
description: |
  Use when: You have an existing implementation plan and want to execute it end-to-end.
  Input: Path to a plan file ($ARTIFACTS_DIR/plan.md or .agents/plans/*.md)
  Output: PR ready for merge with comprehensive review completed

  Full workflow:
  1. Read plan, setup branch, extract scope limits
  2. Verify plan research is still valid
  3. Implement all tasks with type-checking
  4. Run full validation suite
  5. Create PR with template, mark ready
  6. Comprehensive code review (5 parallel agents with scope limit awareness)
  7. Synthesize and fix review findings
  8. Final summary with decision matrix -> GitHub comment + follow-up recommendations

  NOT for: Creating plans from scratch (use archon-idea-to-pr), quick fixes, standalone reviews.

  Models: deepseek-v4-pro for implementation/fixes, deepseek-v4-flash for the rest.

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: SETUP — Read plan, create branch, extract scope
  # ═══════════════════════════════════════════════════════════════════

  - id: plan-setup
    command: archon-plan-setup
    context: fresh
    model: deepseek/deepseek-v4-flash

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: CONFIRM PLAN
  # ═══════════════════════════════════════════════════════════════════

  - id: confirm-plan
    command: archon-confirm-plan
    depends_on: [plan-setup]
    context: fresh
    model: deepseek/deepseek-v4-flash

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-tasks
    command: archon-implement-tasks
    depends_on: [confirm-plan]
    context: fresh
    model: deepseek/deepseek-v4-pro
    effort: max

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: VALIDATE
  # ═══════════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implement-tasks]
    context: fresh
    model: deepseek/deepseek-v4-flash

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINALIZE PR
  # ═══════════════════════════════════════════════════════════════════

  - id: finalize-pr
    command: archon-finalize-pr
    depends_on: [validate]
    context: fresh
    model: deepseek/deepseek-v4-flash

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 6: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [finalize-pr]

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [verify-pr-base]
    context: fresh
    model: deepseek/deepseek-v4-flash

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh
    model: deepseek/deepseek-v4-flash

  - id: code-review
    command: archon-code-review-agent
    depends_on: [sync]
    context: fresh
    model: deepseek/deepseek-v4-flash

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [sync]
    context: fresh
    model: deepseek/deepseek-v4-flash

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [sync]
    context: fresh
    model: deepseek/deepseek-v4-flash

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [sync]
    context: fresh
    model: deepseek/deepseek-v4-flash

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [sync]
    context: fresh
    model: deepseek/deepseek-v4-flash

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh
    model: deepseek/deepseek-v4-flash

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 7: FIX REVIEW ISSUES
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]
    context: fresh
    model: deepseek/deepseek-v4-pro
    effort: max

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 8: FINAL SUMMARY
  # ═══════════════════════════════════════════════════════════════════

  - id: workflow-summary
    command: archon-workflow-summary
    depends_on: [implement-fixes]
    context: fresh
    model: deepseek/deepseek-v4-flash

  # ─── Push notification via ntfy (if configured) ──────────────
  # To enable, create .archon/mcp/ntfy.json in the project root

  - id: check-ntfy
    bash: test -f .archon/mcp/ntfy.json && echo 'true' || echo 'false'

  - id: notify
    depends_on: [check-ntfy]
    trigger_rule: one_success
    when: "$check-ntfy.output == 'true'"
    mcp: .archon/mcp/ntfy.json
    allowed_tools: []
    prompt: |
      Send a push notification about the completed plan-to-PR workflow.
      Include:
      - The workflow name and whether it completed or failed
      - If the node `workflow-summary` ran, reference its output:
        $workflow-summary.output
      - Keep it short — 1-2 sentences for lock screen
      - priority: 4
      - title: "📋 Plan-to-PR $WORKFLOW_STATUS"
